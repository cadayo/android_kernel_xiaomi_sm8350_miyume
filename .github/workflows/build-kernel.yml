name: Build Kernel (star)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: Build Kernel for Xiaomi 11 Ultra (star)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses-dev \
            libelf-dev zip ccache git libtinfo5 libstdc++6 wget u-boot-tools \
            lld python3 python2 libgnutls28-dev

      - name: Download Clang and GCC Toolchains
        run: |
          mkdir -p toolchains
          cd toolchains
          # 克隆 SM8350 常用 AOSP Clang 工具链 (r416111b)
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416111b.git --depth=1 clang
          # 克隆 aarch64 与 arm GCC 交叉编译器
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32

          # 将工具链写入 GITHUB_PATH，确保 build_device.sh 能直接在全局环境变量中调用
          echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> $GITHUB_PATH

      - name: Run Device Build Script
        run: |
          chmod +x build_device.sh
          bash build_device.sh star

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM8350-star-Kernel
          path: |
            *.zip
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/*.dtb
          if-no-files-found: warn
