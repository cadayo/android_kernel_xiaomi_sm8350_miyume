name: Build Kernel (star)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: Build Kernel for Xiaomi 11 Ultra (star)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 自动递归拉取所有 Git 子模块

      - name: Setup KernelSU
        run: |
          # 检查并自动补充 drivers/kernelsu 源码
          if [ ! -d "drivers/kernelsu" ] || [ -z "$(ls -A drivers/kernelsu)" ]; then
            echo "[+] 正在自动拉取 KernelSU 源码到 drivers/kernelsu..."
            git clone https://github.com/tiann/KernelSU drivers/kernelsu
          fi

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses-dev \
            libelf-dev zip ccache git libtinfo5 libstdc++6 wget u-boot-tools \
            lld python3 python2 libgnutls28-dev

      - name: Download Clang and GCC Toolchains
        run: |
          mkdir -p toolchains
          cd toolchains
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 --single-branch gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 --single-branch gcc32

          echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/toolchains/gcc32/bin" >> $GITHUB_PATH

      - name: Run Device Build Script
        run: |
          chmod +x build_device.sh
          bash build_device.sh star

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SM8350-star-Kernel
          path: |
            *.zip
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/*.dtb
          if-no-files-found: warn
